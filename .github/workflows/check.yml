name: Check patcher
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'VERSION'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic transaction tests
        shell: pwsh
        run: ./tools/test.ps1
      - name: Compile verification (no handoff artifact)
        shell: pwsh
        run: ./tools/build.ps1 -OutDirectory ./local/ci-verification -Development
